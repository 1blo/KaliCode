<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kali Code">
<title>Kali Code</title>
<link rel="manifest" href="/mobile/manifest.json">
<link rel="icon" href="/mobile/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/mobile/icon-192.png">
<style>
  :root {
    --bg: #0d0d12;
    --panel: #16161e;
    --panel2: #1e1e28;
    --border: #2a2a36;
    --fg: #e8e8ef;
    --dim: #8b8b9e;
    --accent: #b14aff;
    --accent2: #d18bff;
    --ok: #3ddc84;
    --warn: #ffb648;
    --err: #ff5f56;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior-y: none;
  }
  body { display: flex; flex-direction: column; }

  /* ---------- lock screen ---------- */
  #lock {
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(circle at 50% 20%, #1b1030 0%, var(--bg) 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; gap: 14px;
  }
  #lock h1 { margin: 0; font-size: 26px; letter-spacing: -.5px; }
  #lock p { margin: 0; color: var(--dim); text-align: center; font-size: 14px; max-width: 320px; }
  #lock input {
    width: 100%; max-width: 340px; padding: 14px 16px; font: 16px var(--mono);
    background: var(--panel); color: var(--fg);
    border: 1px solid var(--border); border-radius: 12px; outline: none;
  }
  #lock input:focus { border-color: var(--accent); }
  #lock button {
    width: 100%; max-width: 340px; padding: 14px; font-size: 16px; font-weight: 600;
    background: var(--accent); color: #fff; border: 0; border-radius: 12px; cursor: pointer;
  }
  #lock button:disabled { opacity: .5; }
  #lock .err { color: var(--err); font-size: 13px; min-height: 18px; text-align: center; }

  /* ---------- app shell ---------- */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
    border-bottom: 1px solid var(--border); background: var(--bg);
    position: sticky; top: 0; z-index: 20;
  }
  header .logo {
    width: 26px; height: 26px; border-radius: 7px;
    background: linear-gradient(135deg, var(--accent), #6a2bd9);
    display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff;
  }
  header .title { font-weight: 600; font-size: 15px; flex: 1; }
  header .status { font-size: 11px; color: var(--dim); font-family: var(--mono); }
  header .status.on { color: var(--ok); }
  header .status.off { color: var(--err); }
  header button.icon {
    background: transparent; border: 1px solid var(--border); color: var(--dim);
    border-radius: 8px; padding: 5px 9px; font-size: 12px; cursor: pointer;
  }

  #log { flex: 1; overflow-y: auto; padding: 14px; -webkit-overflow-scrolling: touch; }
  .msg { margin-bottom: 14px; }
  .msg .who {
    font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--dim); margin-bottom: 4px; font-weight: 600;
  }
  .msg.user .bubble {
    background: var(--accent); color: #fff; padding: 10px 13px;
    border-radius: 14px 14px 4px 14px; display: inline-block; max-width: 90%;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.bot .bubble {
    background: var(--panel); padding: 10px 13px; border-radius: 14px 14px 14px 4px;
    white-space: pre-wrap; word-break: break-word; border: 1px solid var(--border);
  }
  .msg.bot.streaming .bubble { border-color: var(--accent); }
  .msg.err .bubble { background: #2a1414; border: 1px solid #522; color: #ffb3ad; }
  .msg.tool .bubble {
    background: var(--panel2); border-left: 3px solid var(--accent2);
    font-family: var(--mono); font-size: 12.5px; padding: 8px 11px;
    border-radius: 6px; white-space: pre-wrap; word-break: break-word;
    max-height: 300px; overflow-y: auto;
  }
  .msg.tool .name { color: var(--accent2); font-weight: 600; }
  .msg.think .bubble { color: var(--dim); font-style: italic; font-size: 13px; }
  .toolout { color: var(--dim); margin-top: 6px; white-space: pre-wrap; }

  /* ---------- permission card ---------- */
  .perm {
    background: #2a2410; border: 1px solid #5a4a1a; border-radius: 12px;
    padding: 13px; margin-bottom: 14px;
  }
  .perm .hdr { color: var(--warn); font-weight: 600; font-size: 13px; margin-bottom: 6px; }
  .perm .what {
    font-family: var(--mono); font-size: 12.5px; background: #1a1608;
    padding: 8px 10px; border-radius: 6px; word-break: break-all; margin-bottom: 11px;
    max-height: 140px; overflow-y: auto;
  }
  .perm .btns { display: flex; gap: 8px; }
  .perm button {
    flex: 1; padding: 11px; border-radius: 9px; border: 0; font-size: 13px;
    font-weight: 600; cursor: pointer; color: #fff;
  }
  .perm .yes { background: var(--ok); color: #06301a; }
  .perm .always { background: var(--accent); }
  .perm .no { background: #3a3a46; }

  /* ---------- composer ---------- */
  #composer {
    display: flex; gap: 8px; padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px);
    border-top: 1px solid var(--border); background: var(--bg);
    position: sticky; bottom: 0;
  }
  #composer textarea {
    flex: 1; resize: none; max-height: 140px; min-height: 44px;
    padding: 11px 14px; font-size: 16px; font-family: inherit;
    background: var(--panel); color: var(--fg);
    border: 1px solid var(--border); border-radius: 22px; outline: none;
  }
  #composer textarea:focus { border-color: var(--accent); }
  #composer button {
    width: 44px; height: 44px; border-radius: 50%; border: 0; flex-shrink: 0;
    background: var(--accent); color: #fff; font-size: 19px; cursor: pointer;
  }
  #composer button:disabled { opacity: .4; }
  #composer button.stop { background: var(--err); }

  .hint { color: var(--dim); font-size: 12px; padding: 0 14px 8px; }
</style>
</head>
<body>

<div id="lock">
  <h1>Kali Code</h1>
  <p>Paste the access token printed by the server to connect.</p>
  <input id="token" type="password" placeholder="Access token" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button id="connect">Connect</button>
  <div class="err" id="lockerr"></div>
</div>

<header>
  <div class="logo">K</div>
  <div class="title" id="title">Kali Code</div>
  <div class="status off" id="status">offline</div>
  <button class="icon" id="reset">new</button>
</header>

<div id="log"></div>
<div class="hint" id="hint">Connected. Ask Kali Code to build or publish your Roblox game.</div>

<div id="composer">
  <textarea id="input" rows="1" placeholder="Message Kali Code..." enterkeyhint="send"></textarea>
  <button id="send" disabled>↑</button>
</div>

<script src="/mobile/app.js"></script>
</body>
</html>
